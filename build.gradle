plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.narturebelle'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

configurations {
    mockitoAgent
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Swagger UI at /swagger-ui.html. Switched on only where SWAGGER_ENABLED=true (local runs by default).
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // Firebase Admin SDK for token verification
    implementation 'com.google.firebase:firebase-admin:9.4.3'

    // Flyway manages the mails schema only; Care stays the migrator of reminders and notification_preferences.
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    runtimeOnly 'org.postgresql:postgresql'
    // The local profile's in-memory database. developmentOnly keeps it out of the deployed jar.
    developmentOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
    mockitoAgent('net.bytebuddy:byte-buddy-agent') { transitive = false }
}

tasks.named('test') {
    useJUnitPlatform()
    maxHeapSize = "384m"
    minHeapSize = "128m"
    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
}
