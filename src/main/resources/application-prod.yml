# No defaults: a missing value must stop startup. Without RESEND_API_KEY, the log-only sender would report
# sends that never happened, and the caller would erase the message for good.
internal:
  api-token: ${INTERNAL_API_TOKEN}

care:
  base-url: ${CARE_API_URL}

email:
  resend:
    api-key: ${RESEND_API_KEY}
